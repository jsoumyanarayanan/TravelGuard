name: Publish TravelGuard test APK

on:
  push:
    branches:
      - main
      - work/travelguard-next-phase
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional app version (for example 1.0.5). Leave blank to use the workflow build number."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare permanent Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/travelguard-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/travelguard-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build permanently signed APK
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH format."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          gradle --no-daemon assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"
          cp app/build/outputs/apk/release/app-release.apk TravelGuard.apk
          echo "TRAVELGUARD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release with signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TRAVELGUARD_VERSION }}
          target_commitish: ${{ github.sha }}
          name: TravelGuard v${{ env.TRAVELGUARD_VERSION }} (testing)
          generate_release_notes: true
          files: TravelGuard.apk
          fail_on_unmatched_files: true
          make_latest: true

name: Build TravelGuard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract TravelGuard source
        run: unzip -q TravelGuard-Android-Source.zip -d source

      - name: Build debug APK
        run: gradle --no-daemon -p source/TravelGuard assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TravelGuard-debug-apk
          path: source/TravelGuard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
